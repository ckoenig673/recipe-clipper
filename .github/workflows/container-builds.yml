name: Container Builds

on:
  pull_request:
    paths:
      - ".github/workflows/container-builds.yml"
      - "backend/**"
      - "frontend/**"
      - "ocr-worker/**"
      - "social-worker/**"
      - "whisper-worker/**"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and smoke-check affected containers
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          services=()

          if grep -qxF ".github/workflows/container-builds.yml" <<<"$changed_files"; then
            services=(backend frontend ocr-worker social-worker whisper-worker)
          else
            for service in backend frontend ocr-worker social-worker whisper-worker; do
              if grep -q "^${service}/" <<<"$changed_files"; then
                services+=("$service")
              fi
            done
          fi

          for service in "${services[@]}"; do
            image="recipe-clipper-${service}-ci:${GITHUB_SHA}"
            docker build --tag "$image" "./$service"

            case "$service" in
              frontend)
                network="recipe-clipper-ci-${GITHUB_RUN_ID}"
                helper="recipe-clipper-backend-dns-${GITHUB_RUN_ID}"
                docker network create "$network"
                docker run --detach --name "$helper" --network "$network" \
                  --network-alias backend --entrypoint sleep "$image" 120
                docker run --rm --network "$network" --entrypoint nginx "$image" -t
                docker rm --force "$helper"
                docker network rm "$network"
                ;;
              backend)
                docker run --rm --entrypoint python "$image" -m pip check
                docker run --rm --entrypoint python "$image" -c "import app.main"
                ;;
              ocr-worker)
                docker run --rm --entrypoint python "$image" -m pip check
                docker run --rm --entrypoint python "$image" -c "import main"
                ;;
              social-worker|whisper-worker)
                docker run --rm --entrypoint python "$image" -m pip check
                docker run --rm --entrypoint python "$image" -c "import app"
                ;;
            esac
          done
