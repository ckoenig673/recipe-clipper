name: Backend Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.18"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt

      - name: Run tests
        env:
          RECIPES_DB_PATH: /tmp/recipe-clipper-ci/recipes.db
        run: |
          mkdir -p /tmp/recipe-clipper-ci
          pytest backend/tests/

      - name: Check release version consistency
        run: python scripts/check_release_versions.py
